meta:
  name: Django PostgreSQL Integration
  key: django-postgres
  type: integration
  version: 1.0.0
  description: Connects a Python backend to PostgreSQL
  tags:
    - integration
    - python
    - postgresql

role:
  group: integration
  unique: false

requirements:
  mandatory: []
  optional: []

compatibility: {}

requires:
  - capability: backend.python
    binding: backend
    optional: false
    unique: true

  - capability: database.connection
    binding: database
    optional: false
    unique: true

contributions:
  - target: backend
    extension_point: python.dependencies
    value:
      - psycopg[binary]

variables: {}
options: {}

assembly:
  priority: 150
  destination_root: .

sources:
  copy: []
  render: []

docs:
  summary: PostgreSQL adapter for Python backends
  notes:
    - Adds the PostgreSQL Python driver through a typed contribution