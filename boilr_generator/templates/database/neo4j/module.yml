meta:
  name: Neo4j
  key: neo4j
  type: database
  version: 1.0.0
  description: Neo4j Community graph database for local Docker development
  tags: [database, graph, neo4j, cypher]
role:
  group: database
provides:
  - capability: graph.connection
    values:
      engine: neo4j
      host: neo4j
      port: 7687
      name: neo4j
      user: neo4j
      password: "{{ neo4j_password }}"
      service: neo4j
      uri: bolt://neo4j:7687
variables:
  neo4j_password:
    type: string
    required: true
    description: Initial password for neo4j; at least 8 characters
  neo4j_http_port:
    type: int
    default: 7474
    description: Host port for Neo4j Browser
  neo4j_bolt_port:
    type: int
    default: 7687
    description: Host port for Bolt driver connections
options: {}
assembly:
  priority: 50
  destination_root: database/neo4j
sources:
  copy:
    - id: readme
      from: docs/README.md
      to: database/neo4j/README.md
      strategy: merge
    - id: import-directory
      from: files/import
      to: database/neo4j/import
      strategy: merge
  render: []
docker:
  services:
    neo4j:
      image: neo4j:5.26-community
      restart: unless-stopped
      environment:
        NEO4J_AUTH: "neo4j/{{ neo4j_password | replace('$', '$$') }}"
      ports:
        - "127.0.0.1:{{ neo4j_http_port }}:7474"
        - "127.0.0.1:{{ neo4j_bolt_port }}:7687"
      volumes:
        - neo4j_data:/data
        - neo4j_logs:/logs
        - ./database/neo4j/import:/var/lib/neo4j/import:ro
      healthcheck:
        test:
          - CMD-SHELL
          - 'cypher-shell -a bolt://localhost:7687 -u neo4j -p "$${NEO4J_AUTH#*/}" -d neo4j "RETURN 1;" || exit 1'
        interval: 30s
        timeout: 20s
        retries: 10
        start_period: 60s
  volumes:
    neo4j_data: {}
    neo4j_logs: {}
exports:
  env:
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_DATABASE: neo4j
    NEO4J_LOCAL_URI: "bolt://localhost:{{ neo4j_bolt_port }}"
    NEO4J_BROWSER_URL: "http://localhost:{{ neo4j_http_port }}"
docs:
  summary: Independent Neo4j Community graph provider
  notes:
    - Provides graph.connection without competing with database.connection
    - Initial user and database are neo4j
    - Documentation and project examples included
    - Password is deliberately not exported into the unquoted dotenv format
