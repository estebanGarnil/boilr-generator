project:
  name: graph_backend
  type: fullstack_web
  version: "1.0.0"
modules:
  - key: postgres
    variables:
      db_name: graph_backend
      db_user: graph_backend
      db_password: dev-sql-password
  - key: django
    variables:
      project_name: graph_backend
      secret_key: dev-secret-change-me
  - key: django-postgres
  - key: neo4j
    variables:
      neo4j_password: dev-graph-password
