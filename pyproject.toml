[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boilr"
version = "0.1.0"
description = "A modular project generator based on YAML manifest and reusable templates."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "estebangarnil" }
]
license = { text = "MIT" }

dependencies = [
    "typer>=0.12.0"
]

[project.scripts]
boilr = "boilr_generator.cli:app"

[tool.setuptools.packages.find]
include = ["boilr_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

