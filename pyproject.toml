[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boilr-generator"
version = "0.1.0"
description = "A modular project generator based on YAML manifest and reusable templates."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "estebangarnil" }
]
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "typer>=0.12",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "Jinja2>=3.1,<4",
    "rich>=13",
    "packaging>=24,<27",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
]

[project.scripts]
boilr = "boilr_generator.cli:app"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["boilr_generator*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker_e2e: requires Docker and runs generated Docker stacks.",
]

[tool.setuptools.package-data]
boilr_generator = [
    "templates/**/*",
    "templates/**/.*",
]

[tool.ruff.lint.isort]
known-first-party = ["boilr_generator"]

[tool.ruff.lint.per-file-ignores]
"boilr_generator/templates/backend/django/files/config/settings/local.py" = ["RUF100"]
"boilr_generator/templates/backend/django/files/config/settings/production.py" = ["RUF100"]
