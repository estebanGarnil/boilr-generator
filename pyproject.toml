[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boilr-generator"
version = "0.1.0"
description = "A modular project generator based on YAML manifest and reusable templates."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "estebangarnil" }
]
license = "MIT"
license-files = ["LICENSE"]

keywords = [
    "code-generation",
    "docker",
    "project-generator",
    "scaffolding",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "typer>=0.12",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "Jinja2>=3.1,<4",
    "rich>=13",
    "packaging>=24,<27",
]

[project.urls]
Homepage = "https://github.com/estebanGarnil/boilr-generator"
Documentation = "https://github.com/estebanGarnil/boilr-generator/tree/main/docs"
Repository = "https://github.com/estebanGarnil/boilr-generator"
Issues = "https://github.com/estebanGarnil/boilr-generator/issues"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
]

[project.scripts]
boilr = "boilr_generator.cli:app"

[tool.uv]
required-version = "==0.12.13"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["boilr_generator*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker_e2e: requires Docker and runs generated Docker stacks.",
]

[tool.setuptools.package-data]
boilr_generator = [
    "templates/**/*",
    "templates/**/.*",
]

[tool.ruff.lint.isort]
known-first-party = ["boilr_generator"]

[tool.ruff.lint.per-file-ignores]
"boilr_generator/templates/backend/django/files/config/settings/local.py" = ["RUF100"]
"boilr_generator/templates/backend/django/files/config/settings/production.py" = ["RUF100"]
