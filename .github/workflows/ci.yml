name: CI

on:
  push:
    branches:
      - main
    paths:
      - "boilr_generator/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "boilr_generator/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.13"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run --locked --all-groups python -m pytest -q

  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.13"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Run Ruff
        run: uv run --locked --all-groups ruff check .

  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.13"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check lock file
        run: uv lock --check

      - name: Build distributions
        run: uv build

      - name: Inspect distribution contents
        run: |
          uv run --locked --all-groups python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          dist_path = Path("dist")
          wheels = sorted(dist_path.glob("*.whl"))
          sdists = sorted(dist_path.glob("*.tar.gz"))

          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          required_wheel_paths = {
              "boilr_generator/templates/backend/django/module.yml",
              "boilr_generator/templates/backend/django/files/templates/.env.j2",
              "boilr_generator/templates/database/postgres/module.yml",
              "boilr_generator/templates/cache/redis/module.yml",
              "boilr_generator/templates/integration/django-postgres/module.yml",
              "boilr_generator/templates/integration/django-redis/module.yml",
          }

          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_names = set(archive.namelist())

              missing_wheel_paths = sorted(
                  required_wheel_paths - wheel_names
              )
              forbidden_wheel_paths = sorted(
                  name
                  for name in wheel_names
                  if name.startswith("tests/")
                  or "__pycache__" in name
                  or name.endswith(".pyc")
              )
              metadata_paths = sorted(
                  name
                  for name in wheel_names
                  if name.endswith(".dist-info/METADATA")
              )

              assert not missing_wheel_paths, missing_wheel_paths
              assert not forbidden_wheel_paths, forbidden_wheel_paths
              assert len(metadata_paths) == 1, metadata_paths

              metadata = archive.read(
                  metadata_paths[0]
              ).decode("utf-8")

              assert "Name: boilr-generator" in metadata
              assert "Requires-Python: >=3.11" in metadata

          required_sdist_suffixes = {
              "/README.md",
              "/LICENSE",
              "/pyproject.toml",
              "/boilr_generator/templates/cache/redis/module.yml",
              "/boilr_generator/templates/integration/django-redis/module.yml",
          }

          with tarfile.open(sdists[0]) as archive:
              sdist_names = archive.getnames()

          missing_sdist_paths = sorted(
              suffix
              for suffix in required_sdist_suffixes
              if not any(
                  name.endswith(suffix)
                  for name in sdist_names
              )
          )

          assert not missing_sdist_paths, missing_sdist_paths

          print(f"Wheel vérifié : {wheels[0].name}")
          print(f"Sdist vérifié : {sdists[0].name}")
          PY

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          set -euo pipefail

          package_root="$PWD"
          audit_root="$RUNNER_TEMP/boilr-wheel-smoke"

          uv venv \
            --python "3.14" \
            "$audit_root/venv"

          venv_python="$audit_root/venv/bin/python"
          wheel_path="$(find "$package_root/dist" -maxdepth 1 -name '*.whl' -print -quit)"

          test -n "$wheel_path"

          uv pip install \
            --python "$venv_python" \
            "$wheel_path"

          uv pip check \
            --python "$venv_python"

          "$venv_python" -c "from importlib.metadata import distribution, version; package=distribution('boilr-generator'); assert package.metadata['Name'] == 'boilr-generator'; assert version('boilr-generator') == package.version; print('Distribution installée :', package.metadata['Name'], package.version)"

          mkdir -p "$audit_root/work"
          cd "$audit_root/work"

          "$venv_python" -c "from pathlib import Path; import boilr_generator; path=Path(boilr_generator.__file__).resolve(); print('Package importé depuis :', path); assert 'site-packages' in path.parts"

          "$venv_python" -m boilr_generator.cli --help

          "$venv_python" -c "from boilr_generator.modules.registry import ModuleRegistry; from boilr_generator.paths import get_builtin_modules_path; registry=ModuleRegistry(get_builtin_modules_path()); required={'django','postgres','redis','django-postgres','django-redis'}; available=set(registry.list_keys()); missing=sorted(required-available); print('Modules installés :', sorted(available)); assert not missing, missing"

          "$venv_python" -m boilr_generator.cli generate \
            "$package_root/tests/e2e/project.yml" \
            "$audit_root/generated" \
            --clean

          "$venv_python" -c "import sys, yaml; from pathlib import Path; root=Path(sys.argv[1]); compose=yaml.safe_load((root/'docker-compose.yml').read_text(encoding='utf-8')); requirements=(root/'backend'/'requirements.txt').read_text(encoding='utf-8'); settings=(root/'backend'/'config'/'settings'/'base.py').read_text(encoding='utf-8'); assert set(compose['services']) == {'backend','db','redis'}; assert 'django-redis>=7.0,<8.0' in requirements; assert 'django_redis.cache.RedisCache' in settings; print('Projet généré depuis le wheel installé : valide.')" \
            "$audit_root/generated"