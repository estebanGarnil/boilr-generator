name: Publish to PyPI

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.13"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check lock file
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Verify release tag
        shell: bash
        run: |
          package_version="$(
            uv run \
              --locked \
              --all-groups \
              python -c \
              "from importlib.metadata import version; print(version('boilr-generator'))"
          )"

          expected_tag="v${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package version ${expected_tag}."
            exit 1
          fi

          echo "Release tag matches package version: ${expected_tag}"

      - name: Build distributions
        run: uv build

      - name: Store distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/boilr-generator

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1