name: Docker E2E

on:
  pull_request:
    paths:
      - "boilr_generator/**"
      - "tests/e2e/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/docker-e2e.yml"

  push:
    branches:
      - main
    paths:
      - "boilr_generator/**"
      - "tests/e2e/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/docker-e2e.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    docker-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-e2e:
    name: Generated Django/PostgreSQL stack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.13"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run Docker end-to-end tests
        env:
          BOILR_RUN_DOCKER_E2E: "1"
        run: |
          uv run --locked --all-groups python -m pytest -q \
            tests/e2e/test_docker_stack.py \
            -m docker_e2e \
            -W error