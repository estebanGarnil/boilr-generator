name: Docker E2E

on:
  pull_request:
    paths:
      - "boilr_generator/**"
      - "tests/e2e/**"
      - "pyproject.toml"
      - ".github/workflows/docker-e2e.yml"

  push:
    branches:
      - main
    paths:
      - "boilr_generator/**"
      - "tests/e2e/**"
      - "pyproject.toml"
      - ".github/workflows/docker-e2e.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    docker-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-e2e:
    name: Generated Django/PostgreSQL stack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run Docker end-to-end tests
        env:
          BOILR_RUN_DOCKER_E2E: "1"
        run: |
          python -m pytest -q \
            tests/e2e/test_docker_stack.py \
            -m docker_e2e \
            -W error